name: PQ motor denemesi
on:
  push:
    branches: [pq-motor-deneme]
jobs:
  pq:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PQTest
        shell: pwsh
        run: ./tools/pqtest/calistir.ps1 -Ayar "$env:GITHUB_WORKSPACE\python\ornek\Ayarlar.xlsx" -Cikti "$env:RUNNER_TEMP\pq.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Karşılaştır
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/pqtest/karsilastir.py "$env:RUNNER_TEMP\pq.json" python/ornek/Ayarlar.xlsx
