name: Testler

on:
  push:
  pull_request:

jobs:
  vba:
    name: VBA kaynak denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: vba_elle kopyaları ve statik denetim
        run: python tools/vba_araclari.py kontrol

  demo:
    name: Tarayıcı demosu dosya listesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: manifest.json güncel mi
        run: python tools/demo_manifest.py && git diff --exit-code demo/manifest.json

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # 3.9 yeni Ubuntu imajlarında yok
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testler (paketteki wheels ile, pip kurulumu yok)
        working-directory: python
        env:
          PYTHONIOENCODING: utf-8
        run: python run_tests.py

  powerquery-motor:
    name: Power Query sorguları (gerçek M motoru, PQTest)
    runs-on: windows-latest
    needs: powerquery-sablon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: pq-aciklama-ornek
          path: python/ornek/pq_aciklama
      - name: Sorguyu çalıştır, Python benzetimiyle karşılaştır
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ayar = "$env:GITHUB_WORKSPACE\python\ornek\Ayarlar.xlsx"
          foreach ($durum in @("-|-", "2026-09|-", "-|Depolama")) {
            $kapanis, $mudurluk = $durum.Split("|") | ForEach-Object { if ($_ -eq "-") { "" } else { $_ } }
            Write-Host "== Kapanış: $(if ($kapanis) { $kapanis } else { 'en son' }) · $(if ($mudurluk) { $mudurluk } else { 'direktörlük' })"
            ./tools/pqtest/calistir.ps1 -Ayar $ayar -Cikti "$env:RUNNER_TEMP\pq.json" -Kapanis $kapanis -Mudurluk $mudurluk
            python tools/pqtest/karsilastir.py "$env:RUNNER_TEMP\pq.json" python/ornek/Ayarlar.xlsx ($durum.Split("|")[0]) ($durum.Split("|")[1])
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Açıklama sorgusu (3 yenileme adımı), Python benzetimiyle karşılaştır
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ayar = "$env:GITHUB_WORKSPACE\python\ornek\Ayarlar.xlsx"
          $klasor = "$env:GITHUB_WORKSPACE\python\ornek\pq_aciklama"
          $is = "$env:RUNNER_TEMP\aciklama"
          python tools/pqtest/aciklama_test.py hazirla 1 $is
          foreach ($adim in 1, 2, 3) {
            Write-Host "== Açıklama adım $adim"
            ./tools/pqtest/aciklama_calistir.ps1 -Ayar $ayar -Klasor $klasor -Kitap "$is\kitap$adim.pq" -Cikti "$is\pq$adim.json" -Ad "Aciklama$adim"
            python tools/pqtest/aciklama_test.py karsilastir $adim "$is\pq$adim.json" $klasor $is
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  powerquery-sablon:
    name: Power Query şablonu (LibreOffice ile hesap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: LibreOffice Calc
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc
      - name: Örnek dönen açıklama dosyaları (M motoru testi için)
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/pqtest/aciklama_ornek.py python/ornek/pq_aciklama
      - name: Şablon formülleri = Python motoru; Açıklama Onayı kontrolleri
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/pqtest/sablon_dogrula.py --aciklama python/ornek/pq_aciklama
      - uses: actions/upload-artifact@v4
        with:
          name: pq-aciklama-ornek
          path: python/ornek/pq_aciklama
          retention-days: 3
